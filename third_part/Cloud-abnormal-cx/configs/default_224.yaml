model:
  qwen_small_path: /data2/zlt/anomaly_detection_llm/model_card/Qwen3.5-2B
  qwen_large_path: /data2/zlt/anomaly_detection_llm/model_card/Qwen3.5-9B
  dino_path: /data2/zlt/anomaly_detection_llm/model_card/dinov3-vitl16-pretrain-lvd1689m
  dino_source: ./dinov3
  device: cuda
  dtype: bfloat16
  image_size: 224
  dino_layers: [6, 12, 18, 24]

data:
  mvtec_root: /data2/zlt/code/CloudEdge-abnormal/datasets/mvtec
  mvtec_llm_root: /data2/zlt/code/CloudEdge-abnormal/datasets/mvtec_anomaly_llm
  visa_root: /data2/zlt/code/CloudEdge-abnormal/datasets/VisA
  num_workers: 4

memory:
  max_patches: 15000
  preselect_patches: 80000
  knn: 3
  calibration_fraction: 0.2
  seed: 42

qwen:
  enabled: true
  normal_references: 3
  max_new_tokens: 384
  cache_dir: /data2/zlt/code/CloudEdge-abnormal/outputs/cloud_abnormal_cx_224/qwen_cache
  min_pixels: 50176
  max_pixels: 50176

fusion:
  qwen_pixel_weight: 0.18
  qwen_image_weight: 0.25
  box_blur_fraction: 0.035

evaluation:
  histogram_bins: 4096
  output_dir: /data2/zlt/code/CloudEdge-abnormal/outputs/cloud_abnormal_cx_224
