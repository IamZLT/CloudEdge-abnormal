# Hybrid with LoRA-tuned cloud VLM
# Edge: Anomalib PaDiM | Cloud: Qwen3-VL-4B + LoRA adapter

data_root: datasets/mvtec
category: screw
seed: 42
results_dir: outputs/hybrid_lora

edge:
  # live default is Qwen3.5-0.8B (configs/edge_qwen35.yaml); export may still use PaDiM banks
  method: qwen35
  anomalib_root: outputs/anomalib
  role: edge
  device: cuda:0

cloud:
  # must match the base used for LoRA training
  model_path: model_card/Qwen3-VL-4B-Instruct
  adapter_path: outputs/qwen_vl_lora/adapter
  device: cuda:0
  dtype: bfloat16
  max_new_tokens: 160
  # LoRA-tuned categories (from outputs/qwen_vl_lora/sft_meta.json). The cloud
  # review is only trusted on these; unseen categories (e.g. bottle) fall back to
  # the hand-written margin-weighted vote instead of an out-of-domain LoRA.
  categories: [screw, cable, pill, capsule, zipper]

collab:
  low_quantile: 0.35
  high_quantile: 0.65
  thr_margin: 0.08
  cloud_extra_latency_ms: 50.0
  max_cloud_reviews: 16

prompt: |
  You are an industrial visual quality inspector.
  Look at the product image and decide if it is defective.
  Reply with ONLY one JSON object (no markdown), fields:
  {
    "decision": "OK" or "NG",
    "confidence": float between 0 and 1,
    "defect_type": string or "none",
    "reason": short English reason
  }
  Rules:
  - OK = normal / no defect; NG = any defect, damage, contamination, missing part.
  - confidence reflects how sure you are.
