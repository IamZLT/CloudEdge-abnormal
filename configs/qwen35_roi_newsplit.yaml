# ROI-conditioned VLM bench on the NEW mvtec_anomaly_llm train/test split.
#
# Key change vs qwen35_roi_vlm.yaml:
#   - few-shot gallery is built from the TEST set normal images (test/{cat}/good),
#     NOT train/good with a fixed 16-shot cap.
#   - leave-one-out: a test/good query is excluded from its own gallery to avoid
#     trivial self-match.
#
# Env: conda activate clip
#   CUDA_VISIBLE_DEVICES=4 python scripts/bench_roi_vlm_newsplit.py \
#     --config configs/qwen35_roi_newsplit.yaml

test_jsonl: datasets/mvtec_anomaly_llm/test.jsonl
train_jsonl: datasets/mvtec_anomaly_llm/train.jsonl
results_dir: outputs/qwen35_roi_newsplit
seed: 42
device: cuda:0

edge:
  method: qwen35
  model_path: /data2/zlt/anomaly_detection_llm/model_card/Qwen3.5-0.8B
  processor_path: /data2/zlt/anomaly_detection_llm/model_card/Qwen3-VL-4B-Instruct
  layers: [6, 8, 10, 12]
  fusion_temp: 0.5
  max_pixels: 50176
  # gallery source: test/good (few-shot support from the test split; leave-one-out)
  gallery_split: test

roi:
  top_k: 2
  pad_ratio: 0.35
  min_side: 96
  # modes evaluated after AD maps are cached:
  #   full       — whole image (baseline)
  #   roi_top1   — single highest-score crop
  #   roi_collage — horizontal collage of top_k crops
  modes: [full, roi_top1, roi_collage]
  save_previews: true

vlm:
  model_path: /data2/zlt/anomaly_detection_llm/model_card/Qwen3.5-0.8B
  model_family: qwen3_5
  dtype: bfloat16
  # null = zero-shot only; set to an adapter dir to also eval a LoRA
  adapter_path: null
  max_new_tokens: 128

prompt_full: |
  You are an industrial visual quality inspector.
  Look at the product image and decide if it is defective.
  Reply with ONLY one JSON object (no markdown), fields:
  {
    "decision": "OK" or "NG",
    "confidence": float between 0 and 1,
    "defect_type": string or "none",
    "reason": short English reason
  }
  Rules:
  - OK = normal / no defect; NG = any defect, damage, contamination, missing part.
  - confidence reflects how sure you are.

prompt_roi: |
  You are an industrial visual quality inspector.
  The image shows suspected anomalous region(s) cropped from a product photo
  (selected by a vision contrast detector). Decide if the product is defective.
  Reply with ONLY one JSON object (no markdown), fields:
  {
    "decision": "OK" or "NG",
    "confidence": float between 0 and 1,
    "defect_type": string or "none",
    "reason": short English reason
  }
  Rules:
  - OK = region looks normal / no clear defect; NG = visible defect in the crop(s).
  - If crops look ambiguous, lower confidence but still choose OK or NG.
