# Full-image + simple Yes/No prompt → LoRA Qwen3.5-0.8B.
#
# Cleanest supervised baseline: NO edge model, NO ROI, NO collage, NO complex
# JSON. Input is the raw full image; prompt is the fixed Yes/No question; the
# model only learns to answer "Yes" (defect) or "No" (normal).
#
# Purpose: measure the pure LoRA fine-tuning gain over the zero-shot Yes/No
# baseline (Acc 0.7433 / F1 0.7325) with the SAME prompt, isolating the effect
# of fine-tuning from input/prompt complexity.
#
# Env: conda activate clip
#   CUDA_VISIBLE_DEVICES=6 python scripts/run_qwen35_full_yn_sft.py \
#     --config configs/qwen35_full_yn_sft.yaml --device cuda:0

train_jsonl: datasets/mvtec_anomaly_llm/train.jsonl
test_jsonl: datasets/mvtec_anomaly_llm/test.jsonl
results_dir: outputs/qwen35_full_yn_sft
seed: 42
device: cuda:0

model:
  model_path: /data2/zlt/anomaly_detection_llm/model_card/Qwen3.5-0.8B
  model_family: qwen3_5
  dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, out_proj, gate_proj, up_proj, down_proj]
  freeze_vision: true

train:
  num_epochs: 1
  learning_rate: 1.0e-4
  batch_size: 1
  grad_accum: 8
  max_image_size: 384
  logging_steps: 10
  warmup_ratio: 0.05
  gradient_checkpointing: true

eval:
  max_images: null   # null = all test images

prompt: |
  Is there any anomaly or defect in the product shown in the image?
  Answer with Yes or No.
