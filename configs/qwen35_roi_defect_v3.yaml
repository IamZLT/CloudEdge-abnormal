# v3: ROI + edge-score CONTEXT, full defect_type/reason targets (NEW outputs)
# Env: conda activate clip
#
#   CUDA_VISIBLE_DEVICES=3 python scripts/run_qwen35_roi_defect_v3.py \
#     --config configs/qwen35_roi_defect_v3.yaml

data_root: datasets/mvtec_anomaly_detection
v2_train_jsonl: outputs/qwen35_roi_gated_v2/roi_sft_train_v2.jsonl
source_train_jsonl: outputs/qwen35_lora/sft_train.jsonl
source_holdout_jsonl: outputs/qwen35_lora/sft_holdout.jsonl
results_dir: outputs/qwen35_roi_defect_v3
seed: 42
device: cuda:0

edge:
  method: qwen35
  model_path: /data2/zlt/anomaly_detection_llm/model_card/Qwen3.5-0.8B
  layers: [6, 8, 10, 12]
  fusion_temp: 0.5
  max_gallery: 16
  max_pixels: 50176
  hard_margin: 0.05

roi:
  top_k: 1
  pad_ratio: 0.4
  min_side: 96

model:
  model_path: /data2/zlt/anomaly_detection_llm/model_card/Qwen3.5-0.8B
  model_family: qwen3_5
  dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, out_proj, gate_proj, up_proj, down_proj]
  freeze_vision: true

train:
  num_epochs: 4
  learning_rate: 1.0e-4
  batch_size: 1
  grad_accum: 8
  max_image_size: 384
  logging_steps: 10
  warmup_ratio: 0.05
  gradient_checkpointing: true
  device: cuda:0

eval:
  max_images: 60

prompt_template: |
  CONTEXT: category={category}; edge_score={edge_score:.3f}; edge_thr={edge_thr:.3f}; edge_hint={edge_hint}; crop_kind={crop_kind}
  Known defect types for this category: {defect_vocab}
  Inspect the cropped region. Decide OK/NG and identify the defect type if NG.
  Reply with ONLY one JSON object:
  {{
    "decision": "OK" or "NG",
    "confidence": float 0-1,
    "defect_type": "none" or one type from the list above,
    "reason": one short English sentence
  }}
  Rules:
  - OK => defect_type must be "none"
  - NG => defect_type must be a concrete type from the list (not "none")
  - Use image evidence; CONTEXT score is a prior, not a hard label.
