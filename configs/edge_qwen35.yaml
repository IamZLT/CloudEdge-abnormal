# Edge default: Qwen3.5-0.8B vision multi-layer patch gallery
# Env tip: conda activate clip  (transformers + safetensors, Qwen3VLVisionModel)

data_root: datasets/mvtec
category: bottle
image_size: 224
device: cuda:0
seed: 42
results_dir: outputs/edge_qwen35

edge:
  method: qwen35                 # default; aliases: qwen35_mlpatch | clip | dinov3 | padim
  model_path: model_card/Qwen3.5-0.8B
  # Qwen3-VL processor fallback (patch packing)
  processor_path: model_card/Qwen3-VL-4B-Instruct
  layers: [6, 8, 10, 12]         # mid→late pre-merger blocks
  fusion_temp: 0.5
  max_gallery: 16                # train/good subsample (seed)
  max_pixels: 50176              # 224*224
  # score → OK/NG: use calibrated thr if set, else percentile on gallery max-scores
  threshold: null
  thr_quantile: 0.95
  hard_margin: 0.05

# optional legacy Anomalib path (method: padim)
padim:
  anomalib_root: outputs/anomalib
  backbone: resnet18
