# Hybrid: edge = Anomalib light AD, cloud = Qwen-VL large model
# Step1 (dinov3): python scripts/export_edge_scores.py --config configs/hybrid.yaml
# Step2 (base):   python scripts/bench_hybrid.py --config configs/hybrid.yaml

data_root: datasets/mvtec
category: bottle
seed: 42
results_dir: outputs/hybrid

edge:
  # Preferred live edge: Qwen3.5-0.8B (configs/edge_qwen35.yaml, python -m edge.infer).
  # Hybrid score export below still reuses Anomalib PaDiM banks for offline routing benches.
  method: qwen35
  anomalib_root: outputs/anomalib
  role: edge
  device: cuda:0

cloud:
  model_path: /data2/zlt/anomaly_detection_llm/model_card/Qwen3-VL-8B-Instruct
  device: cuda:0
  dtype: bfloat16
  max_new_tokens: 160

collab:
  low_quantile: 0.35
  high_quantile: 0.65
  # also mark near-threshold as hard
  thr_margin: 0.08
  cloud_extra_latency_ms: 50.0
  # smoke: limit VLM calls; null = all hard samples
  max_cloud_reviews: 12
  num_edge_nodes: 3
  edge_fleet:
    num_nodes: 3
    default_categories: [bottle, cable, capsule]
    default_cities: [Suzhou, Shenzhen, Chengdu]
    default_access: [fiber_enterprise, broadband, 5g]
  network_env:
    enabled: true
    seed: 42
    route_stretch: 1.5
    fiber_km_per_ms: 200.0
    time_scale: 8.0
    cloud: {city: Shanghai, name: Cloud-Shanghai}
    default_edge_cities: [Suzhou, Shenzhen, Chengdu]
    default_edge_access: [fiber_enterprise, broadband, 5g]
  network:
    profile: geo
    seed: 42
  route_agent:
    enabled: true
    backend: gguf
    # text|auto: reuse AD CONTEXT, skip 2nd vision encode; full: re-encode image
    vision_mode: text
    enforce_context_rules: true
    model_path: /data2/zlt/anomaly_detection_llm/model_card/Qwen3.5-0.8B
    gguf_dir: model_card/qwen3.5VL-0.8B-q
    device: cuda:0
    dtype: bfloat16
    max_new_tokens: 96
    n_ctx: 4096
    n_gpu_layers: -1
    hard_block_on_outage: true

prompt: |
  You are an industrial visual quality inspector.
  Look at the product image and decide if it is defective.
  Reply with ONLY one JSON object (no markdown), fields:
  {
    "decision": "OK" or "NG",
    "confidence": float between 0 and 1,
    "defect_type": string or "none",
    "reason": short English reason
  }
  Rules:
  - OK = normal / no defect; NG = any defect, damage, contamination, missing part.
  - confidence reflects how sure you are.
