# Default stack for CloudEdge-abnormal
# Edge default: Qwen3.5-0.8B vision multi-layer patch gallery
# Cloud: Qwen3-VL (+LoRA) hard-example review
# Optional light AD: Anomalib PaDiM (see edge.alternatives)

data_root: datasets/mvtec
category: bottle
image_size: 224
device: cuda:0
seed: 42
results_dir: outputs

edge:
  # default edge AD (alias: qwen35_mlpatch)
  method: qwen35
  model_path: /data2/zlt/anomaly_detection_llm/model_card/Qwen3.5-0.8B
  # processor fallback for Qwen3.5 packing (if local processor unsupported)
  processor_path: /data2/zlt/anomaly_detection_llm/model_card/Qwen3-VL-4B-Instruct
  layers: [6, 8, 10, 12]
  fusion_temp: 0.5
  max_gallery: 16
  max_pixels: 50176   # 224*224
  device: cuda:0
  # decision: score >= threshold → NG; null = calibrate from gallery quantile
  threshold: null
  thr_quantile: 0.95
  thr_margin: 0.05
  hard_margin: 0.05

  # optional Anomalib fallback (not default)
  alternatives:
    padim:
      model: Padim
      backbone: resnet18
      anomalib_root: outputs/anomalib
      export: openvino

cloud:
  model: Patchcore
  backbone: wide_resnet50_2
  export: torch
  # VLM cloud review uses configs/hybrid*.yaml

collab:
  low_quantile: 0.35
  high_quantile: 0.65
  cloud_extra_latency_ms: 80.0
  upload_bytes_hard: 80000
  upload_bytes_full: 350000
  thr_margin: 0.05
  hard_margin: 0.05
  n_gallery_default: 16
  # Pluggable upload router: cost_risk (CRR, default) | baseline (legacy margin)
  # Implementations live in src/collab_routing/
  route_policy: cost_risk
  cost_risk:
    n_ref: 16
    w_n: 0.8
    w_c: 0.5
    w_g: 0.6
    w_conf: 0.7        # multi-node conflict weight in U (cloud = tiebreaker)
    rtt_ref_ms: 80
    bw_ref_mbps: 50
    weak_c_net: 0.75
    force_unc: 0.85
  # Multi-node conflict (hand-written, no LLM). N nodes judge the SAME image
  # under different deterministic augmentations; disagreement = conflict.
  # Brightness drift (esp. darkening) is what moves patch-gallery scores across
  # the threshold. Measured conflict on bottle (~110 test): 0.9/1.1 ≈ 2%,
  # 0.85/1.15 ≈ 5%, 0.8/1.2 ≈ 10%, 0.7/1.3 ≈ 20%. Default targets M6 <=5%.
  conflict:
    n_nodes: 3
    augs: [identity, brightness-0.85, brightness-1.15]
  cloud_admission:
    max_inflight: 2
    fairness_gamma: 0.1
    # Cloud VLM review confidence floor. Below this the cloud result is NOT
    # adopted (domain-gap guard); arbitration falls back to the hand-written
    # margin-weighted vote. Prevents a LoRA tuned on [screw,cable,pill,capsule,
    # zipper] from overriding a correct edge call on an unseen category (bottle).
    min_cloud_conf: 0.6
  # Multi-edge fleet (1 cloud + N edges). Alias: num_edge_nodes
  num_edge_nodes: 3
  edge_fleet:
    num_nodes: 3
    default_categories: [bottle, cable, capsule]
    # geo placement (aligned with network_env.default_edge_cities)
    default_cities: [Suzhou, Shenzhen, Chengdu]
    default_access: [fiber_enterprise, broadband, 5g]
    # optional explicit overrides:
    # nodes:
    #   - id: edge-0
    #     category: bottle
    #     city: Suzhou
    #     access: fiber_enterprise

  # Physical + temporal network world (preferred). See src/network_env.py
  # enabled:false falls back to legacy static profiles below.
  network_env:
    enabled: true
    seed: 42
    route_stretch: 1.5          # fiber path ≈ geodesic × stretch
    fiber_km_per_ms: 200.0      # ≈ c/1.5 in silica fiber
    processing_rtt_ms: 2.0
    timeout_ms: 3000.0
    time_scale: 8.0             # >1 accelerates OU/diurnal for demos
    cloud:
      city: Shanghai
      name: Cloud-Shanghai
      access: fiber_enterprise
    default_edge_cities: [Suzhou, Shenzhen, Chengdu, Beijing, Urumqi]
    default_edge_access: [fiber_enterprise, broadband, 5g, broadband, weak_backhaul]
    dynamics:
      ou_theta: 0.12            # congestion mean-reversion / second
      ou_mu: 0.15
      ou_sigma: 0.25
      diurnal_amp: 0.30         # working-hour load swing
      burst_rate_per_hour: 0.6
      burst_duration_s: 25.0
      outage_rate_per_day: 0.05
      outage_duration_s: 45.0

  # legacy static profiles — unused when network_env.enabled=true (default).
  # Routing CONTEXT always uses live RTT/BW/loss from the geo sim, not these names.
  network:
    profile: geo
    seed: 42
  # Qwen3.5-0.8B multimodal agent: legacy LLM upload router.
  # enabled=false: routing is hand-written CRR (cost_risk + conflict); the LLM is
  # used ONLY for detection (edge AD + cloud VLM review), never for the route.
  route_agent:
    enabled: false
    # backend: gguf (default Q4) | hf (bf16 full VL)
    backend: gguf
    # text|auto: reuse AD CONTEXT, skip 2nd vision encode; full: re-encode image
    vision_mode: text
    # LLM decides upload; CRR is not included in CONTEXT. Legacy rules_snap stays off.
    enforce_context_rules: false
    # false: a valid LLM upload decision is final (no post-LLM rule overwrite).
    hard_route_guard: false
    # Do not short-circuit LLM on outage; model sees link_tier=outage in CONTEXT.
    hard_block_on_outage: false
    # false: always call RouteAgent LLM for upload decision (no CRR-only cascade skip).
    cascade_skip_low_uncertainty: false
    parse_retry: 1
    model_path: /data2/zlt/anomaly_detection_llm/model_card/Qwen3.5-0.8B
    gguf_dir: model_card/qwen3.5VL-0.8B-q
    # mmproj_gguf: model_card/qwen3.5VL-0.8B-q/Qwen3.5-0.8B-mmproj-F16.gguf
    device: cuda:0
    dtype: bfloat16
    max_new_tokens: 96
    n_ctx: 4096
    n_gpu_layers: -1

mlflow:
  enabled: true
  tracking_uri: outputs/mlruns
  experiment_name: cloudedge-abnormal

kubeedge:
  manifests_dir: deploy/kubeedge
